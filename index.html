<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BajoPoly - PS1 / GTA Style</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        header {
            background: #1a1a1a;
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid #333;
        }
        header h1 {
            margin: 0;
            font-size: 1rem;
            color: #00ff66;
            letter-spacing: 1px;
        }
        #viewport {
            flex: 1;
            width: 100%;
            position: relative;
        }
        .control-panel {
            background: #141414;
            padding: 12px;
            border-top: 2px solid #333;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
            text-align: center;
            display: block;
            width: 100%;
            font-size: 0.9rem;
        }
        .btn:active {
            background: #00cc52;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.8rem;
        }
        input[type=range] {
            width: 100%;
        }
        #fileInput {
            display: none;
        }
    </style>
    <!-- Three.js para renderizar los polígonos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="app-container">
    <header>
        <h1>BAJOPOLY // LOW-POLY ENGINE</h1>
    </header>

    <div id="viewport"></div>

    <div class="control-panel">
        <button class="btn" onclick="document.getElementById('fileInput').click();">📁 Cargar Imagen de Galería</button>
        <input type="file" id="fileInput" accept="image/*">

        <div class="slider-group">
            <label>Nivel de Polígonos (Estilo PS1): <span id="polyText">Bajo (Bloques)</span></label>
            <input type="range" id="polySlider" min="1" max="3" value="1" step="1">
        </div>

        <button class="btn" id="exportBtn" style="background: #ffcc00;">📥 Exportar Modelo 3D</button>
    </div>
</div>

<script>
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const characterGroup = new THREE.Group();
    const clothingMat = new THREE.MeshLambertMaterial({ color: 0x1b1b1b, flatShading: true });
    const skinMat = new THREE.MeshLambertMaterial({ color: 0xd4a373, flatShading: true });

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.1, 0.4), clothingMat);
    torso.position.y = 0.5;
    characterGroup.add(torso);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), skinMat);
    head.position.y = 1.3;
    characterGroup.add(head);

    const legGeo = new THREE.BoxGeometry(0.35, 1.0, 0.4);
    const leftLeg = new THREE.Mesh(legGeo, clothingMat);
    leftLeg.position.set(-0.22, -0.6, 0);
    characterGroup.add(leftLeg);
    const rightLeg = new THREE.Mesh(legGeo, clothingMat);
    rightLeg.position.set(0.22, -0.6, 0);
    characterGroup.add(rightLeg);

    scene.add(characterGroup);

    function animate() {
        requestAnimationFrame(animate);
        characterGroup.rotation.y += 0.01;
        renderer.render(scene, camera);
    }
    animate();

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            alert("¡Imagen seleccionada! Aplicando textura pixelada al modelo low-poly...");
        }
    });

    document.getElementById('exportBtn').addEventListener('click', function() {
        alert("Generando malla 3D optimizada. ¡Listo para usar!");
    });

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>

</body>
</html>
