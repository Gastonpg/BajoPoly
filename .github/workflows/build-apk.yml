name: Build Web App
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          cp index.html dist/index.html

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Bajopoly-Web-Bundle
          path: dist/
